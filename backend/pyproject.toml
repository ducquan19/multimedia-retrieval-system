[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-retrieval-inspector-backend"
version = "0.1.0"
description = "FastAPI backend for the AIC 2026 Retrieval Inspector"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139,<0.140",
  "pydantic-settings>=2.14,<3",
  "uvicorn[standard]>=0.35,<1",
  "faiss-cpu>=1.9.0",
  "elasticsearch>=8.15.0",
  "torch>=2.4.0",
  "transformers>=4.44.0",
  "pillow>=10.4.0"
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
