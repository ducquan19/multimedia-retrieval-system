name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # torchvision (pulled in by timm) must come from the same index as torch: a PyPI build
          # does not match the CPU torch and transformers then fails to import.
          python -m pip install torch torchvision -c backend/requirements.lock --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "./backend[dev]" -c backend/requirements.lock
      - name: Lint
        run: |
          python -m ruff check backend scripts notebooks
          python -m ruff format --check backend scripts notebooks
      # The frontend's response types are generated from the API; fail when they are stale.
      - name: API types up to date
        run: python scripts/generate_api_types.py --check
      # Tests use in-memory fakes: no models, indexes or Elasticsearch are needed.
      - name: Test
        run: python -m pytest backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
