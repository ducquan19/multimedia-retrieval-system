services:
  elasticsearch:
    # Same major version as the Python client (elasticsearch>=8.15,<9).
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: aic_elasticsearch
    environment:
      - discovery.type=single-node
      # Local development only: no authentication, bound to localhost below.
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  es_data:
